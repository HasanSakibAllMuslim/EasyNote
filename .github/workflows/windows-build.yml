name: Windows x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-build.yml
      - README.md
      - README-SETUP.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - package.json
      - package-lock.json
      - index.html
      - manifest.webmanifest
      - assets/**
      - build/**
      - css/**
      - electron/**
      - js/**
      - libs/**
      - scripts/**

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # npm's pre-dist lifecycle runs prepare:icon before Electron Builder.
      - name: Build complete Windows x64 NSIS installer
        run: npm run dist -- --publish never

      - name: Validate installer and calculate SHA-256
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -File -Filter 'EasyNote-Setup-*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one EasyNote NSIS installer; found $($installers.Count)."
          }

          $installer = $installers[0]
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          $summary = @(
            '## Windows x64 unsigned installer'
            ''
            "- File: $($installer.Name)"
            "- Size: $($installer.Length) bytes"
            "- SHA-256: $sha256"
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # archive:false keeps the EXE as a direct PE artifact for a future SignPath
      # <pe-file> configuration. It also avoids signing a ZIP wrapper by mistake.
      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EasyNote-Windows-x64-Unsigned
          path: ${{ steps.installer.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
